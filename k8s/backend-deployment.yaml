apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: online-library
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: online-library
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # під час оновлення завжди є робочі поди
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: online-library
    spec:
      containers:
        - name: backend
          image: ghcr.io/1nxiz/online-library-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          # усі ключі ConfigMap і Secret стають змінними оточення
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-secret
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 40 # init_db може чекати БД до 30 с
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
