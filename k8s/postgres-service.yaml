apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: online-library
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: online-library
spec:
  type: ClusterIP # БД доступна лише всередині кластера
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
