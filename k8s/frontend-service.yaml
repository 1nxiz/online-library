apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: online-library
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: online-library
spec:
  type: NodePort # доступ з хоста: minikube service frontend -n online-library
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
