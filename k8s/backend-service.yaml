apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: online-library
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: online-library
spec:
  type: ClusterIP # API доступне всередині кластера (frontend -> backend)
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
