apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: online-library
  labels:
    app.kubernetes.io/part-of: online-library
data:
  # параметри застосунку
  APP_TITLE: "Онлайн бібліотека"
  LOG_LEVEL: "INFO"
  # параметри підключення до БД (без пароля — він у Secret)
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "library"
  DB_USER: "library"
