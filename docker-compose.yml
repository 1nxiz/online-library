services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library-dev-password
      POSTGRES_DB: library
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: 1.0.0-local
    environment:
      DB_HOST: db
      DB_NAME: library
      DB_USER: library
      DB_PASSWORD: library-dev-password
      APP_TITLE: Онлайн бібліотека
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
