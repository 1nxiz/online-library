# ЛР-8: LocalStack (Lambda, API Gateway, DynamoDB).
# ЛР-9: + три екземпляри застосунку і nginx-балансувальник.
# Образ LocalStack 4.14.0 — останній вільний образ спільноти, працює без акаунта й токена.
name: online-library-aws

x-app: &app
  build:
    context: .
    dockerfile: app/Dockerfile
  image: online-library-aws-app:local
  environment: &app-env
    AWS_ENDPOINT_URL: http://localstack:4566 # DynamoDB у LocalStack
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    TABLE_NAME: Books
  depends_on:
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10
  restart: "no"

services:
  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: lambda,apigateway,dynamodb,iam,sts,logs,cloudwatch
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_DOCKER_NETWORK: library-aws
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      library: {}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Сталі IP-адреси: після stop/start екземпляр повертається на ту саму адресу,
  # і nginx (який резолвить імена при старті) знову його бачить.
  app1:
    <<: *app
    container_name: app1
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports:
      - "127.0.0.1:8001:8000" # прямий доступ без балансувальника (для порівняння)
    networks:
      library: { ipv4_address: 172.30.0.11 }

  app2:
    <<: *app
    container_name: app2
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    networks:
      library: { ipv4_address: 172.30.0.12 }

  app3:
    <<: *app
    container_name: app3
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    networks:
      library: { ipv4_address: 172.30.0.13 }

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    ports:
      - "127.0.0.1:8080:80" # єдина точка входу
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    networks:
      library: { ipv4_address: 172.30.0.20 }

networks:
  library:
    name: library-aws
    ipam:
      config:
        - subnet: 172.30.0.0/24
