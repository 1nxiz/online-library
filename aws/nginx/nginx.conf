# ЛР-9: nginx як балансувальник навантаження для трьох екземплярів застосунку.
# Файл підключається в блок http{} офіційного образу (/etc/nginx/conf.d/default.conf).

log_format balancer '$remote_addr "$request" $status upstream=$upstream_addr '
                    'upstream_status=$upstream_status time=${request_time}s';

upstream library_app {
    # алгоритм за замовчуванням — round-robin (по черзі)
    # пасивна перевірка: після 1 невдалої спроби сервер вилучається з ротації на 10 с
    server app1:8000 max_fails=1 fail_timeout=10s;
    server app2:8000 max_fails=1 fail_timeout=10s;
    server app3:8000 max_fails=1 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    access_log /dev/stdout balancer;

    # перевірка самого балансувальника
    location = /lb-status {
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    location / {
        proxy_pass http://library_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;

        # якщо екземпляр недоступний — швидко пробуємо наступний
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # який екземпляр обробив запит (видно в curl -i)
        add_header X-Upstream $upstream_addr always;
    }
}
