# Кореневий Application (App of Apps).
# Це ЄДИНИЙ об'єкт, який застосовується вручну:  kubectl apply -f bootstrap/root-app.yaml
# Усе інше Argo CD бере з каталогу argocd-apps/ у Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/1nxiz/online-library.git
    targetRevision: lab5 # гілка цієї лабораторної
    path: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
