# ЛР-6: контролер Argo Rollouts встановлюється з Git, як і застосунок
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # CRD Rollout мають з'явитися раніше за застосунок
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.43.8 # контролер Argo Rollouts v1.10.1
    helm:
      valuesObject:
        installCRDs: true
        dashboard:
          enabled: true # веб-дашборд Rollouts (kubectl port-forward ... 3100)
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD великі для client-side apply
