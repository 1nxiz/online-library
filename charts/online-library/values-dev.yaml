# Середовище розробки: мало ресурсів, 1 репліка, доступ через NodePort
backend:
  replicaCount: 1
  image:
    tag: "1.1.0"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 192Mi }

frontend:
  replicaCount: 1
  image:
    tag: "1.1.0"
  service:
    type: NodePort

config:
  appTitle: "Онлайн бібліотека (dev)"
  logLevel: DEBUG

postgres:
  persistence:
    enabled: false # дані dev не бережемо

ingress:
  enabled: false
