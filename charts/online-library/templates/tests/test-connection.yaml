{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "library.componentName" (list . "test") }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - |
          set -e
          echo "backend /health:"
          curl -fsS http://{{ include "library.componentName" (list . "backend") }}:{{ .Values.backend.service.port }}/health
          echo; echo "frontend -> /api/books:"
          curl -fsS http://{{ include "library.componentName" (list . "frontend") }}:{{ .Values.frontend.service.port }}/api/books
          echo; echo "All checks passed"
{{- end }}
