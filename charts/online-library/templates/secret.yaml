{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library.secretName" . }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
type: Opaque
data:
  # значення береться з values (або --set secret.dbPassword=...), у шаблоні паролів немає
  DB_PASSWORD: {{ required "secret.dbPassword обов'язковий, якщо не задано existingSecret" .Values.secret.dbPassword | b64enc | quote }}
{{- end }}
