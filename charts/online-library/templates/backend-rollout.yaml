{{- /* ЛР-6: Argo Rollouts замість Deployment (rollout.enabled: true) */}}
{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "library.componentName" (list . "backend") }}
  labels:
    {{- include "library.componentLabels" (list . "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.rollout.replicaCount }}
  revisionHistoryLimit: 10
  # через скільки секунд без прогресу вважати оновлення невдалим (Argo CD -> Degraded)
  progressDeadlineSeconds: {{ .Values.backend.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "library.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    {{- include "library.backendPod" . | nindent 4 }}
  strategy:
    canary:
      # без traffic manager вага досягається кількістю подів:
      # 4 репліки -> 25% = 1 под нової версії, 50% = 2, 75% = 3
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
{{- end }}
