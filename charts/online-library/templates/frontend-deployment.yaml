apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "library.componentName" (list . "frontend") }}
  labels:
    {{- include "library.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "library.selectorLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "library.componentLabels" (list . "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "library.image" (dict "image" .Values.frontend.image "chart" .Chart) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_URL
              value: {{ printf "http://%s:%v" (include "library.componentName" (list . "backend")) .Values.backend.service.port | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
