{{- /* ЛР-4 п.9b: хук перед оновленням — перевіряє, що БД доступна */}}
{{- if .Values.hooks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "library.componentName" (list . "db-check") }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "library.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              echo "pre-upgrade: checking database before upgrade to revision {{ .Release.Revision }}"
              pg_isready -h {{ include "library.componentName" (list . "postgres") }} -p 5432 -U {{ .Values.config.dbUser }}
{{- end }}
