apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.componentName" (list . "backend") }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "library.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
