apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.componentName" (list . "postgres") }}
  labels:
    {{- include "library.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "library.selectorLabels" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
