# Значення для minikube під керуванням Argo CD (ЛР-5, ЛР-6).
# Реліз робиться комітом: змініть backend.image.tag -> git commit -> git push.

backend:
  image:
    tag: "1.0.0" # <- ЗМІНЮВАТИ ТУТ для нового релізу (не latest)
  replicaCount: 2

frontend:
  image:
    tag: "1.0.0"
  replicaCount: 2
  service:
    type: NodePort
    nodePort: 30080

config:
  appTitle: "Онлайн бібліотека"
  logLevel: INFO

# Пароля в Git немає: Secret створюється в кластері один раз вручну
#   kubectl create secret generic library-db-secret -n online-library --from-literal=DB_PASSWORD=<пароль>
secret:
  existingSecret: library-db-secret
  dbPassword: ""

postgres:
  persistence:
    enabled: true

ingress:
  enabled: false

# Helm-хуки/тести тут вимкнені: Argo CD перетворює pre-upgrade у PreSync,
# який на першій синхронізації запустився б раніше за БД.
hooks:
  enabled: false
tests:
  enabled: false

# ЛР-6: backend розгортається через Argo Rollouts (canary, 4 репліки).
# У ЛР-5 тут false (звичайний Deployment); у ЛР-6 змінити на true комітом.
rollout:
  enabled: false
  replicaCount: 4
