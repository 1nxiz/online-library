# Значення для minikube під керуванням Argo CD (ЛР-5, ЛР-6, ЛР-7).
# Реліз робиться комітом: змініть backend.image.tag -> git commit -> git push.

backend:
  image:
    tag: "2.0.0" # <- ЗМІНЮВАТИ ТУТ для нового релізу (ЛР-7: образ з /metrics)
  replicaCount: 2
  # ЛР-7: «погана» поведінка. "0" — нормальна версія; "0.5" — половина запитів отримує 500
  env:
    - name: FAIL_RATE
      value: "0"

frontend:
  image:
    tag: "2.0.0"
  replicaCount: 2
  service:
    type: NodePort
    nodePort: 30080

config:
  appTitle: "Онлайн бібліотека"
  logLevel: INFO

# Пароля в Git немає: Secret створюється в кластері один раз вручну
#   kubectl create secret generic library-db-secret -n online-library --from-literal=DB_PASSWORD=<пароль>
secret:
  existingSecret: library-db-secret
  dbPassword: ""

postgres:
  persistence:
    enabled: true

ingress:
  enabled: false

# Helm-хуки/тести тут вимкнені: Argo CD перетворює pre-upgrade у PreSync,
# який на першій синхронізації запустився б раніше за БД.
hooks:
  enabled: false
tests:
  enabled: false

# ЛР-6/7: backend через Argo Rollouts (canary). 5 реплік: setWeight 20 = рівно 1 canary-под
rollout:
  enabled: true
  replicaCount: 5
  # ЛР-7: рішення про реліз приймає аналіз метрик (ручної паузи з ЛР-6 більше немає)
  analysis:
    enabled: true
  canary:
    steps:
      - setWeight: 20
      - pause: { duration: 30s } # дати метрикам нового пода накопичитися
      - analysis:
          templates:
            - templateName: online-library-success-rate # = <реліз>-success-rate
      - setWeight: 60
      - pause: { duration: 30s }

# ЛР-7: ServiceMonitor + дашборд Grafana і алерт на частку 5xx
metrics:
  enabled: true
alerts:
  enabled: true
